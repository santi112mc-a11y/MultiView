<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiView V14 TEST</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080a0d;color:#f3f5f7;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.setup{height:100%;display:flex;align-items:center;justify-content:center}
.card{width:min(500px,92vw);background:#15181d;border:1px solid #2b3139;border-radius:18px;padding:32px;box-shadow:0 20px 60px #0009}
.icon{font-size:32px;width:64px;height:64px;border-radius:16px;background:#222730;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
h1{margin:0 0 8px;font-size:26px}.sub{color:#9da5b1;line-height:1.5;margin:0 0 24px}
label{display:block;font-size:13px;color:#b9c0ca;margin:15px 0 7px}
input,select{width:100%;background:#0e1115;color:#fff;border:1px solid #303640;border-radius:10px;padding:12px;outline:0}
.primary{width:100%;border:0;border-radius:10px;padding:13px;margin-top:21px;background:#fff;color:#101216;font-weight:700}
.workspace{display:none;width:100%;height:100%;flex-direction:column}
.toolbar{height:58px;min-height:58px;background:#111419;border-bottom:1px solid #292e36;display:flex;align-items:center;gap:8px;padding:9px 12px}
.title{font-weight:700;margin-right:auto}.tool{background:#1b2027;color:#e7eaf0;border:1px solid #303640;border-radius:8px;padding:8px 11px}
.grid{flex:1;min-height:0;display:grid;gap:8px;padding:8px;background:#080a0d;overflow:hidden}
.panel{position:relative;min-width:0;min-height:0;background:#11151a;border:1px solid #2b3139;border-radius:10px;overflow:hidden}
.panel-head{position:absolute;z-index:20;top:6px;left:6px;right:6px;height:34px;display:flex;align-items:center;gap:5px;background:#111419e8;border:1px solid #303640;border-radius:7px;padding:4px;opacity:.35;transition:.15s}
.panel:hover .panel-head{opacity:1}.num{font-size:11px;color:#b7bec8;margin-right:auto;padding-left:4px}
.small{font-size:11px;background:#20252d;color:#e0e4e9;border:1px solid #353b45;border-radius:5px;padding:5px 7px;min-width:28px;height:30px}
.zoom-value{min-width:48px;text-align:center}
.note{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;color:#7f8995;font-size:12px;padding:25px;background:#11151a}
.note strong{display:block;color:#b9c0ca;margin-bottom:7px}
.panel-frame{position:absolute;z-index:1;left:0;right:0;top:0;bottom:0;width:100%;height:100%;border:0;background:#000}
.urlbox{position:absolute;z-index:30;top:46px;left:7px;right:7px;display:none;background:#0d1014f5;border:1px solid #303640;border-radius:8px;padding:7px}
.panel.show .urlbox{display:block}.urlbox input{font-size:12px;padding:8px}.urlbox button{width:100%;margin-top:5px;padding:7px;border:0;border-radius:6px}
.status{position:fixed;left:12px;bottom:12px;z-index:200;background:#171b21;color:#cbd2dc;border:1px solid #343b45;border-radius:8px;padding:8px 10px;font:12px Arial;display:none;max-width:70vw}
</style>
</head>
<body>
<section class="setup" id="setup">
  <div class="card">
    <div class="icon">▦</div>
    <h1>Crear un MultiView</h1>
    <p class="sub">Cada rectángulo tiene su propio contenido web. Las páginas quedan encerradas dentro de su panel.</p>
    <label>Cantidad de paneles</label>
    <input id="count" type="number" min="1" max="30" value="4">
    <label>Distribución</label>
    <select id="cols"><option value="auto">Automática</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
    <button class="primary" id="create">Crear MultiView</button>
  </div>
</section>

<section class="workspace" id="workspace">
  <div class="toolbar"><div class="title">▦ MultiView V14 TEST</div><button class="tool" id="add">＋ Panel</button><button class="tool" id="reset">Reconfigurar</button></div>
  <div class="grid" id="grid"></div>
</section>
<div class="status" id="status"></div>

<script>
const setup=document.getElementById('setup');
const workspace=document.getElementById('workspace');
const grid=document.getElementById('grid');
const status=document.getElementById('status');
let count=0;
let mode='auto';
const panels=new Map();

function showStatus(msg){
  status.textContent=msg;
  status.style.display='block';
  clearTimeout(showStatus._t);
  showStatus._t=setTimeout(()=>status.style.display='none',2600);
}

function cols(n){
  if(mode!=='auto')return Number(mode);
  if(n<=1)return 1;if(n<=4)return 2;if(n<=9)return 3;if(n<=16)return 4;if(n<=25)return 5;return 6;
}
function norm(v){
  v=String(v||'').trim();
  if(!v)return '';
  return /^https?:\/\//i.test(v)?v:'https://'+v;
}
function isFormula(url){try{const h=new URL(url).hostname.toLowerCase().replace(/^www\./,'');return h==='formula-timer.com'||h.endsWith('.formula-timer.com')}catch{return false}}
function defaultZoom(url){return isFormula(url)?0.55:1}
function applyGrid(){
  const c=cols(count);
  grid.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;
  grid.style.gridTemplateRows=`repeat(${Math.ceil(count/c)},minmax(0,1fr))`;
}

function setZoom(p,z){
  z=Math.max(0.25,Math.min(2,Number(z)||1));
  p.zoom=z;
  p.zoomLabel.textContent=Math.round(z*100)+'%';
  window.multiview.setZoom({id:p.id,zoom:z}).catch(()=>{});
}

function loadPanel(p,url){
  url=norm(url); if(!url)return;
  p.url=url;
  p.zoom=defaultZoom(url);
  p.zoomLabel.textContent=Math.round(p.zoom*100)+'%';
  p.note.style.display='none';
  window.multiview.registerPanel({id:p.id,url:p.url,zoom:p.zoom});
  p.web.src=url;
}

function addPanel(){
  if(count>=30)return;
  count++;
  const id='p'+count;
  const el=document.createElement('div');
  el.className='panel';
  el.innerHTML=`
    <div class="panel-head">
      <span class="num">Panel ${count}</span>
      <button class="small back">←</button>
      <button class="small minus">−</button>
      <button class="small zoom-value">100%</button>
      <button class="small plus">＋</button>
      <button class="small resetzoom">1:1</button>
      <button class="small url">URL</button>
      <button class="small reload">↻</button>
      <button class="small clear">×</button>
    </div>
    <div class="note"><div><strong>Cargá una URL</strong>El sitio se mostrará dentro de este rectángulo.</div></div>
    <iframe class="panel-frame" name="mv-panel-${id}" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-presentation allow-pointer-lock" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="urlbox"><input placeholder="https://ejemplo.com"><button>Cargar</button></div>
  `;
  grid.appendChild(el);

  const web=el.querySelector('.panel-frame');
  const input=el.querySelector('.urlbox input');
  const p={id,el,web,input,note:el.querySelector('.note'),zoomLabel:el.querySelector('.zoom-value'),zoom:1,url:''};
  panels.set(id,p);

  el.querySelector('.url').onclick=()=>{el.classList.toggle('show');if(el.classList.contains('show'))input.focus()};
  el.querySelector('.urlbox button').onclick=()=>{loadPanel(p,input.value);el.classList.remove('show')};
  input.onkeydown=e=>{if(e.key==='Enter'){loadPanel(p,input.value);el.classList.remove('show')}};
  el.querySelector('.back').onclick=()=>window.multiview.goBack({id}).then(r=>{if(r&&!r.ok)showStatus(r.error||'No hay una página anterior.')}).catch(()=>{});
  el.querySelector('.reload').onclick=()=>window.multiview.reload({id}).catch(()=>{});
  el.querySelector('.clear').onclick=()=>{
    p.web.src='about:blank';p.url='';p.zoom=1;p.zoomLabel.textContent='100%';p.note.style.display='flex';p.el.classList.remove('show');
    window.multiview.clearFrame({id}).catch(()=>{});
  };
  el.querySelector('.minus').onclick=()=>setZoom(p,p.zoom-.05);
  el.querySelector('.plus').onclick=()=>setZoom(p,p.zoom+.05);
  el.querySelector('.resetzoom').onclick=()=>setZoom(p,defaultZoom(p.url));
  el.querySelector('.zoom-value').onclick=()=>{
    const v=prompt('Zoom en porcentaje (25-200):',String(Math.round(p.zoom*100)));
    if(v!==null&&!Number.isNaN(Number(v)))setZoom(p,Number(v)/100);
  };

  el.addEventListener('dragover',e=>e.preventDefault());
  el.addEventListener('drop',e=>{
    e.preventDefault();
    const u=e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain')||e.dataTransfer.getData('text');
    if(u)loadPanel(p,u.split('\n')[0]);
  });

  applyGrid();
}

document.getElementById('create').onclick=()=>{
  const desired=Math.max(1,Math.min(30,Math.floor(Number(document.getElementById('count').value)||4)));
  mode=document.getElementById('cols').value;
  setup.style.display='none';
  workspace.style.display='flex';
  count=0;
  panels.clear();
  grid.innerHTML='';
  for(let i=0;i<desired;i++)addPanel();
  applyGrid();
};

document.getElementById('add').onclick=()=>{if(count<30){addPanel();applyGrid()}};

document.getElementById('reset').onclick=()=>{
  window.multiview.clearAll().catch(()=>{});
  panels.clear();count=0;grid.innerHTML='';
  workspace.style.display='none';setup.style.display='flex';
};

window.addEventListener('resize',applyGrid);
window.multiview.on('mv-status',d=>showStatus(d?.message||'Publicidad bloqueada.'));
window.multiview.on('mv-ui-error',d=>showStatus(d?.message||'Error de MultiView'));

</script>
</body>
</html>
