<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiView</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080a0d;color:#f3f5f7;overflow:hidden}
.setup{height:100%;display:flex;align-items:center;justify-content:center}
.card{width:min(500px,92vw);background:#15181d;border:1px solid #2b3139;border-radius:18px;padding:32px;box-shadow:0 20px 60px #0009}
.icon{font-size:32px;width:64px;height:64px;border-radius:16px;background:#222730;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
h1{margin:0 0 8px;font-size:26px}.sub{color:#9da5b1;line-height:1.5;margin:0 0 24px}
label{display:block;font-size:13px;color:#b9c0ca;margin:15px 0 7px}
input,select{width:100%;background:#0e1115;color:#fff;border:1px solid #303640;border-radius:10px;padding:12px;outline:0}
button{cursor:pointer}
.primary{width:100%;border:0;border-radius:10px;padding:13px;margin-top:21px;background:#fff;color:#101216;font-weight:700}
.workspace{display:none;width:100%;height:100%;flex-direction:column}
.toolbar{height:58px;min-height:58px;background:#111419;border-bottom:1px solid #292e36;display:flex;align-items:center;gap:8px;padding:9px 12px}
.title{font-weight:700;margin-right:auto}.tool{background:#1b2027;color:#e7eaf0;border:1px solid #303640;border-radius:8px;padding:8px 11px}
.grid{flex:1;min-height:0;display:grid;gap:8px;padding:8px;background:#080a0d;overflow:hidden}
.panel{position:relative;min-width:0;min-height:0;background:#11151a;border:1px solid #2b3139;border-radius:10px;overflow:hidden}
.panel-head{height:42px;display:flex;align-items:center;gap:5px;background:#111419e8;border:1px solid #303640;border-radius:7px;padding:4px;opacity:.45;transition:.15s;position:relative;z-index:2}
.panel:hover .panel-head{opacity:1}.num{font-size:11px;color:#b7bec8;margin-right:auto;padding-left:4px}
.small{font-size:11px;background:#20252d;color:#e0e4e9;border:1px solid #353b45;border-radius:5px;padding:5px 7px;min-width:28px;height:30px}
.zoom-label{font-size:10px;min-width:45px;text-align:center;color:#cbd2dc;background:#171b21;border:1px solid #353b45;border-radius:5px;padding:5px 3px;height:30px}
.url-dialog{position:absolute;top:49px;left:6px;right:6px;z-index:3;background:#0d1014f5;border:1px solid #303640;border-radius:8px;padding:7px;display:none}
.panel.show .url-dialog{display:block}.url-dialog input{font-size:12px;padding:8px}.url-dialog button{width:100%;margin-top:5px;padding:7px;border:0;border-radius:6px}
.note{position:absolute;top:42px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#7f8995;font-size:12px;padding:25px;background:#11151a}
.note strong{display:block;color:#b9c0ca;margin-bottom:7px}
.status{position:fixed;left:12px;bottom:12px;z-index:999;background:#171b21;color:#cbd2dc;border:1px solid #343b45;border-radius:8px;padding:8px 10px;font:12px Arial;display:none;max-width:70vw}
</style>
</head>
<body>
<section class="setup" id="setup">
<div class="card"><div class="icon">▦</div><h1>Crear un MultiView</h1><p class="sub">Cada rectángulo tiene su propio navegador independiente.</p>
<label>Cantidad de paneles</label><input id="count" type="number" min="1" max="30" value="4">
<label>Distribución</label><select id="cols"><option value="auto">Automática</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
<button class="primary" id="create">Crear MultiView</button></div>
</section>
<section class="workspace" id="workspace"><div class="toolbar"><div class="title">▦ MultiView</div><button class="tool" id="add">＋ Panel</button><button class="tool" id="reset">Reconfigurar</button></div><div class="grid" id="grid"></div></section>
<div class="status" id="status"></div>
<script>
const setup=document.getElementById('setup'),workspace=document.getElementById('workspace'),grid=document.getElementById('grid'),status=document.getElementById('status');
let count=0,mode='auto',panels=new Map();
function showStatus(msg,error=false){status.textContent=msg;status.style.display='block';status.style.borderColor=error?'#9b3b3b':'#343b45';if(!error)setTimeout(()=>status.style.display='none',2500)}
function cols(n){if(mode!=='auto')return +mode;if(n<=1)return 1;if(n<=4)return 2;if(n<=9)return 3;if(n<=16)return 4;if(n<=25)return 5;return 6}
function norm(v){v=String(v||'').trim();if(!v)return '';return /^https?:\/\//i.test(v)?v:'https://'+v}
function isFormula(url){try{const h=new URL(url).hostname.toLowerCase().replace(/^www\./,'');return h==='formula-timer.com'||h.endsWith('.formula-timer.com')}catch{return false}}
function setGrid(){const c=cols(count);grid.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;grid.style.gridTemplateRows=`repeat(${Math.ceil(count/c)},minmax(0,1fr))`}
function rects(){return [...panels].map(([id,p])=>{const r=p.el.getBoundingClientRect();return{id,rect:{x:r.left,y:r.top,width:r.width,height:r.height}}})}
async function sync(){setGrid();await new Promise(requestAnimationFrame);try{await window.multiview.updateRects(rects())}catch(e){showStatus('Error de distribución: '+e.message,true)}}
function defaultZoom(p){return isFormula(p.url)?0.55:1}
async function loadPanel(p,url){url=norm(url);if(!url)return;p.url=url;p.zoom=defaultZoom(p);p.zoomLabel.textContent=Math.round(p.zoom*100)+'%';p.note.style.display='none';try{await window.multiview.createView({id:p.id,url,rect:(()=>{const r=p.el.getBoundingClientRect();return{x:r.left,y:r.top,width:r.width,height:r.height}})()});await sync()}catch(e){showStatus('No se pudo cargar: '+e.message,true)}}
function addPanel(){if(count>=30)return;count++;const num=count,id='p'+num;const el=document.createElement('div');el.className='panel';el.innerHTML=`<div class="panel-head"><span class="num">Panel ${num}</span><button class="small back">←</button><button class="small minus">−</button><button class="zoom-label">100%</button><button class="small plus">＋</button><button class="small resetzoom">1:1</button><button class="small url">URL</button><button class="small reload">↻</button><button class="small clear">×</button></div><div class="note"><div><strong>Cargá una URL</strong>El sitio se mostrará dentro de este rectángulo.</div></div><div class="url-dialog"><input placeholder="https://ejemplo.com"><button>Cargar</button></div>`;grid.appendChild(el);const p={id,el,url:'',zoom:1,zoomLabel:el.querySelector('.zoom-label'),note:el.querySelector('.note'),input:el.querySelector('.url-dialog input')};panels.set(id,p);
const input=p.input;el.querySelector('.url').onclick=()=>{const v=prompt('URL del panel:',p.url||'https://');if(v!==null&&v.trim())loadPanel(p,v)};el.querySelector('.back').onclick=()=>window.multiview.goBack({id}).catch(()=>{});el.querySelector('.reload').onclick=()=>window.multiview.reload({id});el.querySelector('.clear').onclick=async()=>{await window.multiview.removeView({id});p.url='';p.zoom=1;p.zoomLabel.textContent='100%';p.note.style.display='flex'};function change(delta){p.zoom=Math.max(.25,Math.min(2,Math.round((p.zoom+delta)*20)/20));p.zoomLabel.textContent=Math.round(p.zoom*100)+'%';window.multiview.setZoom({id,zoom:p.zoom})};el.querySelector('.minus').onclick=()=>change(-.05);el.querySelector('.plus').onclick=()=>change(.05);el.querySelector('.zoom-label').onclick=()=>{const v=prompt('Zoom del panel (25 a 200):',String(Math.round(p.zoom*100)));if(v!==null&&!Number.isNaN(Number(v))){p.zoom=Math.max(.25,Math.min(2,Number(v)/100));p.zoomLabel.textContent=Math.round(p.zoom*100)+'%';window.multiview.setZoom({id,zoom:p.zoom})}};el.querySelector('.resetzoom').onclick=()=>{p.zoom=defaultZoom(p);p.zoomLabel.textContent=Math.round(p.zoom*100)+'%';window.multiview.setZoom({id,zoom:p.zoom})};setGrid()}

document.getElementById('create').onclick=()=>{const n=Math.max(1,Math.min(30,Math.floor(Number(document.getElementById('count').value)||4)));mode=document.getElementById('cols').value;setup.style.display='none';workspace.style.display='flex';count=0;panels.clear();grid.innerHTML='';for(let i=0;i<n;i++)addPanel();sync()};
document.getElementById('add').onclick=()=>{if(count<30){addPanel();sync()}};
document.getElementById('reset').onclick=async()=>{try{await window.multiview.clearAll()}catch{}location.reload()};
window.addEventListener('resize',()=>sync());
window.multiview.on('mv-zoom',d=>{const p=panels.get(d.id);if(p){p.zoom=d.zoom;p.zoomLabel.textContent=Math.round(d.zoom*100)+'%'}});window.multiview.on('mv-popup-blocked',()=>showStatus('Publicidad bloqueada.'));window.multiview.on('mv-error',d=>showStatus('Panel: '+(d.errorDescription||'error'),true));window.multiview.on('mv-ui-error',d=>showStatus(d.message||'Error',true));
</script>
</body></html>
